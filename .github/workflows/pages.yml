name: Static Explorer Preview And Pages

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the verified artifact to GitHub Pages"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-py312.txt

      - name: Install model-verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-py312.txt

      - name: Verify browser model artifact
        run: |
          node --test tests/browser/model-parity.test.mjs tests/browser/reflow-contract.test.mjs
          python scripts/verify_penguins_browser_model.py --offline

      - name: Assemble Pages artifact with provenance
        run: |
          mkdir -p /tmp/penguin-model-explorer-pages
          cp -R site/. /tmp/penguin-model-explorer-pages/
          cp reports/evidence/penguins_browser_model_provenance.json \
            /tmp/penguin-model-explorer-pages/model-provenance.json
          DEPLOY_INPUT="${{ inputs.deploy }}" GITHUB_SHA="$GITHUB_SHA" python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("/tmp/penguin-model-explorer-pages/build-provenance.json").write_text(
              json.dumps(
                  {
                      "schema_version": 1,
                      "artifact_id": "penguin-model-explorer",
                      "commit": os.environ["GITHUB_SHA"],
                      "deploy": os.environ["DEPLOY_INPUT"].lower() == "true",
                      "model_provenance": "model-provenance.json",
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload downloadable static artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: penguin-model-explorer
          path: /tmp/penguin-model-explorer-pages
          if-no-files-found: error
          retention-days: 14

      - name: Package Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: /tmp/penguin-model-explorer-pages

  deploy:
    if: ${{ inputs.deploy }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact to Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
