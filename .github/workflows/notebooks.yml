name: Notebook Execution

on:
  workflow_dispatch:
  schedule:
    - cron: "21 8 * * *"

permissions:
  contents: read

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints-py312.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -c constraints-py312.txt

      - name: Preflight public data sources
        run: |
          python - <<'PY'
          from ml_portfolio.bank_marketing import BANK_DATA_SHA256, BANK_DATA_URL
          from ml_portfolio.data_sources import assert_min_bytes, assert_sha256, download_bytes_with_retry
          from ml_portfolio.penguins import DATA_SHA256 as PENGUINS_DATA_SHA256
          from ml_portfolio.penguins import DATA_URL as PENGUINS_DATA_URL

          sources = [
              (
                  "UCI Bank Marketing ZIP",
                  BANK_DATA_URL,
                  1_000_000,
                  BANK_DATA_SHA256,
              ),
              (
                  "Palmer Penguins CSV",
                  PENGUINS_DATA_URL,
                  10_000,
                  PENGUINS_DATA_SHA256,
              ),
          ]

          for label, url, min_bytes, expected_sha256 in sources:
              content = download_bytes_with_retry(url, attempts=3, timeout=30)
              assert_min_bytes(content, min_bytes=min_bytes, label=label)
              assert_sha256(content, expected_sha256=expected_sha256, label=label)
              print(f"{label}: {len(content):,} bytes")
          PY

      - name: Execute notebooks under /tmp
        env:
          OUTPUT_DIR: /tmp/ml-notebook-checks
          HTML_OUTPUT_DIR: /tmp/ml-notebook-html-reports
        run: |
          mkdir -p "$OUTPUT_DIR"
          mkdir -p "$HTML_OUTPUT_DIR"
          for notebook in notebooks/*.ipynb; do
            echo "Executing ${notebook}"
            jupyter nbconvert \
              --to notebook \
              --execute "$notebook" \
              --output-dir "$OUTPUT_DIR" \
              --ExecutePreprocessor.kernel_name=python3 \
              --ExecutePreprocessor.timeout=600
            executed_notebook="$OUTPUT_DIR/$(basename "$notebook")"
            jupyter nbconvert \
              --to html \
              "$executed_notebook" \
              --output-dir "$HTML_OUTPUT_DIR"
          done

      - name: Upload executed notebooks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: executed-notebooks
          path: /tmp/ml-notebook-checks
          if-no-files-found: error
          retention-days: 30

      - name: Upload executed HTML reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: executed-html-reports
          path: /tmp/ml-notebook-html-reports
          if-no-files-found: error
          retention-days: 30
