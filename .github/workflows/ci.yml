name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The evidence verifier reads the source commit named in its manifest.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints-py312.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -c constraints-py312.txt

      - name: Confirm package import
        run: |
          python -c "import ml_portfolio; print('import ok')"

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Run network-free CLI smoke test
        run: |
          python demo/predict_penguin_species.py \
            --data-url "file://${PWD}/tests/fixtures/penguins_toy.csv"

      - name: Validate notebook JSON
        run: |
          python - <<'PY'
          from pathlib import Path

          import nbformat

          paths = sorted(Path("notebooks").glob("*.ipynb"))
          if not paths:
              raise SystemExit("No notebooks found under notebooks/")

          for path in paths:
              notebook = nbformat.read(path, as_version=4)
              nbformat.validate(notebook)
              code_cells = [cell for cell in notebook.cells if cell.cell_type == "code"]
              if not code_cells:
                  raise SystemExit(f"{path} has no code cells")

          print(f"Validated {len(paths)} notebooks")
          PY

      - name: Check source notebooks are stripped
        run: |
          python - <<'PY'
          from pathlib import Path

          import nbformat

          failures = []
          for path in sorted(Path("notebooks").glob("*.ipynb")):
              notebook = nbformat.read(path, as_version=4)
              for index, cell in enumerate(notebook.cells, start=1):
                  if cell.cell_type != "code":
                      continue
                  if cell.get("execution_count") is not None:
                      failures.append(f"{path}: cell {index} has execution_count")
                  if cell.get("outputs"):
                      failures.append(f"{path}: cell {index} has outputs")
                  if cell.get("metadata", {}).get("execution"):
                      failures.append(f"{path}: cell {index} has execution metadata")

          if failures:
              raise SystemExit("\n".join(failures))

          print("Source notebooks are stripped")
          PY

      - name: Verify committed Bank execution evidence
        run: |
          python scripts/verify_bank_evidence.py

      - name: Run pre-commit hooks
        run: |
          pre-commit run --all-files
