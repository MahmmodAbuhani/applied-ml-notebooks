[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-portfolio"
version = "0.1.0"
description = "Reusable helpers for a classical machine-learning notebook portfolio."
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["ml_portfolio"]

[tool.setuptools.package-data]
ml_portfolio = ["portfolio.mplstyle"]
